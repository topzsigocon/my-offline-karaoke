name: Unpack zip and build


on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
  workflow_dispatch:


permissions:
  contents: write


jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Unpack zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Walang .zip sa root; laktawan."
            exit 0
          fi
          for z in "${zips[@]}"; do
            unzip -o "$z" -x ".github/*"
            git rm -q -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack update zip" || echo "Walang pagbabago"
          git push


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9


      - name: Build debug APK
        run: gradle assembleDebug --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-offline-karaoke-debug-apk
          path: app/build/outputs/apk/debug/*.apk


      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
